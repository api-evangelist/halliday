aid: halliday
name: Halliday
description: >-
  Halliday is a web3 payments and agentic-workflow company (a16z crypto Series A) building the
  end-to-end onchain deposit platform. Its Agentic Workflow Protocol (AWP) lets developers compose
  high-level, AI-executable workflows behind immutable guardrails without writing smart-contract
  code. The flagship product, Halliday Payments, is a unified cross-chain payments API and drop-in
  widget that lets users onramp from fiat, bridge, and swap to acquire any asset on any chain in a
  fully self-custodial way, routing intelligently across onramps (MoonPay, Transak, Stripe), swaps,
  and bridges. The Halliday API V2 (https://v2.prod.halliday.xyz) exposes chains, assets, quotes,
  payments, balances, withdrawals, and signed workflow webhooks, authenticated with publishable
  API keys, alongside JS/React/React Native SDKs and a published Claude Code integration skill.
